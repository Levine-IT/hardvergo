services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54323:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3,lambda
      - DEBUG=1
      - DATA_DIR=/var/lib/localstack
      - PERSISTENCE=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/var/lib/localstack
    networks:
      - app-network

  localstack-init:
    image: amazon/aws-cli:latest
    container_name: localstack-init
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        yum install -y curl
        curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
        yum install -y nodejs zip
        chmod +x /docker/init-queues.sh
        /docker/init-queues.sh
    volumes:
      - "./docker:/docker"
      - "./apps/optimize-draft-listing-image:/apps/optimize-draft-listing-image"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-central-1
      - LOCALSTACK_ENDPOINT=http://localstack:4566
    depends_on:
      - localstack
    networks:
      - app-network
  sqs-admin:
    image: pacovk/sqs-admin:latest
    container_name: sqs-admin
    ports:
      - "3999:3999"
    environment:
      - SQS_ENDPOINT_URL=http://localstack:4566
      - SQS_AWS_REGION=eu-central-1
    depends_on:
      - localstack
    networks:
      - app-network

  s3manager:
    image: cloudlena/s3manager
    container_name: s3manager
    ports:
      - "8080:8080"
    environment:
      - ENDPOINT=localstack:4566
      - ACCESS_KEY_ID=test
      - SECRET_ACCESS_KEY=test
      - USE_SSL=false
      - ALLOW_DELETE=true
    depends_on:
      - localstack
    networks:
      - app-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=1200
    networks:
      - app-network


  drizzle-studio:
    image: node:22-alpine
    container_name: drizzle-studio
    working_dir: /app
    ports:
      - "4983:4983"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
    volumes:
      - "./packages/database:/app"
    command: sh -c "npm install -g drizzle-kit && npx drizzle-kit studio --port 4983 --host 0.0.0.0"
    depends_on:
      - postgres
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  localstack_data:
